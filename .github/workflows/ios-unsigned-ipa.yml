name: iOS unsigned IPA

# Builds an UNSIGNED .ipa on a GitHub-hosted macOS runner, because linking
# Godot's libgodot.a into an .app requires Xcode, which only runs on macOS.
# You then sign it on your own machine with Sideloadly / AltStore / SideStore
# using a free Apple ID, or install it with TrollStore on a supported iOS.
#
# Cost: macOS runners are free on PUBLIC repos. On a private repo with a free
# plan they bill at 10x, so the 2,000 included minutes are ~200 macOS minutes.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  GODOT_VERSION: "4.7.1"
  # Path to the folder holding project.godot, relative to the repo root.
  PROJECT_DIR: "."
  EXPORT_PRESET: "iOS"
  IPA_NAME: "BlockXHell-unsigned"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-ios-v1

      - name: Install Godot ${{ env.GODOT_VERSION }} + iOS templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-bin
          curl -fL --retry 3 -o /tmp/godot.zip \
            "$BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          xattr -dr com.apple.quarantine ~/godot-bin/Godot.app || true

          curl -fL --retry 3 -o /tmp/templates.tpz \
            "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp
          TPL="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL"
          mv /tmp/templates/* "$TPL/"
          ls "$TPL" | grep -i ios

      - name: Force "export project only" on the iOS preset
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          # On macOS, Godot's iOS exporter runs `xcodebuild -archive` ITSELF at
          # the end of the export -- the output path being a folder rather than
          # an .ipa does not stop it. That archive fails here because the
          # release config asks for "Apple Distribution" while the project is on
          # automatic signing with a placeholder team, which is a conflict Xcode
          # refuses. `export_project_only` makes Godot emit the Xcode project
          # and stop, leaving the build to the next step where signing is off.
          #
          # Patched on the runner rather than committed because the Godot editor
          # rewrites export_presets.cfg whenever the export dialog is opened.
          python3 - <<'PY'
          import re

          path = "export_presets.cfg"
          text = open(path, encoding="utf-8").read()

          # Find which preset index is the iOS one, then patch its options block.
          idx = None
          for m in re.finditer(r'\[preset\.(\d+)\]([^\[]*)', text):
              if 'platform="iOS"' in m.group(2):
                  idx = m.group(1)
                  break
          if idx is None:
              raise SystemExit("no iOS preset found in export_presets.cfg")

          header = "[preset.%s.options]" % idx
          start = text.index(header) + len(header)
          end = text.find("[preset.", start)
          if end == -1:
              end = len(text)
          block = text[start:end]

          key = "application/export_project_only"
          if key in block:
              block = re.sub(re.escape(key) + r"=\w+", key + "=true", block)
          else:
              block = "\n" + key + "=true" + block

          open(path, "w", encoding="utf-8").write(text[:start] + block + text[end:])
          print("patched preset.%s -> %s=true" % (idx, key))
          PY

      - name: Export the Xcode project
        run: |
          set -euo pipefail
          GODOT="$HOME/godot-bin/Godot.app/Contents/MacOS/Godot"
          chmod +x "$GODOT"
          cd "$PROJECT_DIR"

          # First run builds the .import cache; a cold cache exits non-zero,
          # which is expected, so it must not fail the job.
          "$GODOT" --headless --import || true
          "$GODOT" --headless --import

          mkdir -p "$GITHUB_WORKSPACE/ios-build"
          "$GODOT" --headless --export-release "$EXPORT_PRESET" \
            "$GITHUB_WORKSPACE/ios-build/BlockXHell"

          # Godot reports export failures through its own error channel and can
          # still exit 0, so assert on the artefact instead of the exit code.
          test -n "$(find "$GITHUB_WORKSPACE/ios-build" -maxdepth 2 -name '*.xcodeproj' -print -quit)" \
            || { echo "::error::Godot did not produce an Xcode project"; exit 1; }

      - name: Compile the .app without signing
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/ios-build"
          PROJ="$(find . -maxdepth 2 -name '*.xcodeproj' | head -n1)"
          echo "Xcode project: $PROJ"
          SCHEME="$(xcodebuild -project "$PROJ" -list -json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')"
          echo "Scheme: $SCHEME"

          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package Payload/ into an .ipa
        run: |
          set -euo pipefail
          APP="$(find "$GITHUB_WORKSPACE/dd/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name '*.app' | head -n1)"
          test -n "$APP" || { echo "no .app produced"; exit 1; }
          # An .ipa is just a zip with the .app inside a folder called Payload.
          mkdir -p "$GITHUB_WORKSPACE/out/Payload"
          cp -R "$APP" "$GITHUB_WORKSPACE/out/Payload/"
          cd "$GITHUB_WORKSPACE/out"
          zip -qry "${IPA_NAME}.ipa" Payload
          rm -rf Payload
          ls -lh "${IPA_NAME}.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: out/${{ env.IPA_NAME }}.ipa
          if-no-files-found: error
          retention-days: 30

      # Artifacts need a logged-in GitHub session and download as a .zip, which
      # is unusable from a phone. A rolling release gives a plain, public,
      # direct-download URL that on-device installers can fetch:
      #   https://github.com/<owner>/<repo>/releases/download/ios-latest/BlockXHell-unsigned.ipa
      - name: Publish to the rolling "ios-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete ios-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-latest \
            --title "iOS sideload build (unsigned)" \
            --notes "Unsigned IPA built from \`${GITHUB_SHA:0:7}\`.

          Sign it on-device with SideStore or Feather using your own Apple ID,
          or on a desktop with Sideloadly. Free Apple ID certificates expire
          after 7 days." \
            "out/${IPA_NAME}.ipa"
          echo "Direct link: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/ios-latest/${IPA_NAME}.ipa"
